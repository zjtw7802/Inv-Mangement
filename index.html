<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeautyGuard - 工程版</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div class="phone">
    <div class="status"><span id="clock">--:--</span><span>5G 🔋</span></div>
    <header class="header">
      <h1 id="title">BeautyGuard</h1>
      <p id="subtitle">双效期管理 · 囤货不浪费</p>
    </header>

    <main class="content">
      <section id="screen-inventory" class="screen"></section>
      <section id="screen-usage" class="screen hidden"></section>
      <section id="screen-empty" class="screen hidden"></section>
      <section id="screen-settings" class="screen hidden"></section>
    </main>

    <nav class="tabs">
      <button class="tab active" data-screen="inventory">囤货</button>
      <button class="tab" data-screen="usage">使用</button>
      <button class="tab" data-screen="empty">空瓶</button>
      <button class="tab" data-screen="settings">设置</button>
    </nav>
  </div>

  <button id="fab" class="fab" title="新增产品">＋</button>

  <dialog id="productModal" class="modal">
    <form id="productForm" method="dialog" class="form">
      <div class="form-head">
        <h3>新增产品</h3>
        <button type="button" id="closeModal" class="ghost">关闭</button>
      </div>
      <label>品牌<input name="brand" required placeholder="如：SK-II" /></label>
      <label>品名<input name="name" required placeholder="如：神仙水" /></label>
      <div class="grid2">
        <label>分类
          <select name="category">
            <option value="护肤">护肤</option>
            <option value="彩妆">彩妆</option>
            <option value="防晒">防晒</option>
            <option value="身体">身体</option>
          </select>
        </label>
        <label>季节
          <select name="season">
            <option value="all">全年</option>
            <option value="summer">夏季</option>
            <option value="winter">冬季</option>
          </select>
        </label>
      </div>
      <div class="grid2">
        <label>购买日期<input name="purchaseDate" type="date" required /></label>
        <label>未开封到期<input name="unopenedExpiry" type="date" required /></label>
      </div>
      <div class="grid2">
        <label>是否已开封
          <select name="opened"><option value="false">未开封</option><option value="true">已开封</option></select>
        </label>
        <label>PAO（月）
          <select name="paoMonths"><option>6</option><option selected>12</option><option>24</option></select>
        </label>
      </div>
      <div class="grid2">
        <label>开封日期<input name="openedDate" type="date" /></label>
        <label>价格（元）<input name="price" type="number" min="0" value="0" /></label>
      </div>
      <label>库存数量<input name="qty" type="number" min="1" value="1" required /></label>
      <button class="primary" type="submit">保存</button>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
